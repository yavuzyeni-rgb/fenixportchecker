[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portgozu"
version = "0.1.1"
description = "FenixPortChecker — Windows switch port gözlem aracı: VLAN, IP, LLDP/CDP komşu ve bağlı port trafiği."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yavuz Yeni" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
windows = ["scapy>=2.5"]

[project.scripts]
portgozu = "portgozu.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portgozu = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
